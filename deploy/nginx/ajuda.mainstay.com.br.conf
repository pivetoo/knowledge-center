# vhost do host (nao do container) para ajuda.mainstay.com.br.
# Instalar em /etc/nginx/sites-available/ e linkar em sites-enabled/.
# As diretivas de SSL sao acrescentadas pelo certbot no primeiro `certbot --nginx -d ajuda.mainstay.com.br`.
server {
    listen 80;
    listen [::]:80;
    server_name ajuda.mainstay.com.br;

    client_max_body_size 5m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Receiver de deploy: escuta so em 127.0.0.1:9881 e exige token.
    location = /deploy-hook {
        proxy_pass http://127.0.0.1:9881/deploy-hook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8114;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
